<mat-card class="header-card-global">
    <mat-card-header>
        <mat-card-title>
            <mat-icon>widgets</mat-icon>
            Catálogo Productos Contpaqi
        </mat-card-title>
    </mat-card-header>
</mat-card>

<div class="container">
    <div class="search-form-row">
        <mat-card class="form-card">
            <mat-card-header>
                <mat-card-title>{{ isEditing ? 'Editar Producto' : 'Nuevo Producto' }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <form (ngSubmit)="saveProduct(productForm)" #productForm="ngForm">
                    <div class="form-row">
                        <mat-form-field appearance="outline" class="flex-3">
                            <mat-label>Descripción</mat-label>
                            <input matInput [(ngModel)]="newProduct.description" name="description" required placeholder="Ej. Contpaqi Contabilidad">
                        </mat-form-field>

                        <mat-form-field appearance="outline" class="flex-1">
                            <mat-label>Precio</mat-label>
                            <input matInput type="number" [(ngModel)]="newProduct.price" name="price" required min="0" placeholder="0.00">
                        </mat-form-field>

                        <div class="button-group flex-1">
                            <button mat-raised-button color="primary" type="submit" [disabled]="!productForm.form.valid">
                                {{ isEditing ? 'Guardar' : 'Agregar' }}
                            </button>
                            <button mat-button type="button" *ngIf="isEditing" (click)="cancelEdit(productForm)">
                                Cancelar
                            </button>
                        </div>
                    </div>
                </form>
            </mat-card-content>
        </mat-card>
    </div>

    <mat-card class="table-card">
        <mat-card-content>
            <div class="table-header-tools">
                <mat-form-field appearance="outline" class="search-field">
                    <mat-label>Buscar producto...</mat-label>
                    <input matInput [(ngModel)]="searchTerm" placeholder="Escribe para buscar...">
                    <mat-icon matSuffix>search</mat-icon>
                </mat-form-field>
            </div>

            <div class="table-container">
                <table mat-table [dataSource]="filteredProducts" class="mat-elevation-z0">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef> ID </th>
                        <td mat-cell *matCellDef="let product"> {{product.id}} </td>
                    </ng-container>

                    <ng-container matColumnDef="description">
                        <th mat-header-cell *matHeaderCellDef> Descripción </th>
                        <td mat-cell *matCellDef="let product"> {{product.description}} </td>
                    </ng-container>

                    <ng-container matColumnDef="price">
                        <th mat-header-cell *matHeaderCellDef> Precio </th>
                        <td mat-cell *matCellDef="let product"> {{product.price | currency}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Acciones </th>
                        <td mat-cell *matCellDef="let product">
                            <button mat-icon-button color="primary" (click)="editProduct(product)" title="Editar">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" (click)="deleteProduct(product)" title="Eliminar">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <!-- Row shown when there is no matching data -->
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="4" style="text-align: center; padding: 20px;">
                            No se encontraron productos Contpaqi.
                        </td>
                    </tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>
</div>
