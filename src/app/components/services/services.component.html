<mat-card class="header-card-global">
    <mat-card-header>
        <mat-card-title>
            <mat-icon>build</mat-icon>
            Catálogo de Servicios
        </mat-card-title>
    </mat-card-header>
</mat-card>

<div class="container">

    <mat-card class="form-card">
        <mat-card-header>
            <mat-card-title>{{ isEditing ? 'Editar Servicio' : 'Nuevo Servicio' }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <div class="form-row">
                <mat-form-field appearance="outline" style="flex: 3; min-width: 250px;">
                    <mat-label>Descripción</mat-label>
                    <input matInput [(ngModel)]="newService.description" placeholder="Nombre del servicio">
                </mat-form-field>

                <mat-form-field appearance="outline" style="flex: 1; min-width: 130px;">
                    <mat-label>Precio</mat-label>
                    <span matPrefix>$&nbsp;</span>
                    <input matInput type="number" [(ngModel)]="newService.price" placeholder="0.00">
                </mat-form-field>

                <button mat-raised-button color="primary" (click)="saveService()" [disabled]="!newService.description || isSaving">
                    <mat-icon>{{ isEditing ? 'update' : 'add' }}</mat-icon>
                    {{ isSaving ? 'Guardando...' : (isEditing ? 'Actualizar' : 'Agregar') }}
                </button>

                <button mat-button *ngIf="isEditing" (click)="resetForm()">
                    Cancelar
                </button>
            </div>
        </mat-card-content>
    </mat-card>

    <mat-card class="table-card">
        <div class="table-container">
            <table mat-table [dataSource]="services" class="mat-elevation-z0">
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef> ID </th>
                    <td mat-cell *matCellDef="let service"> {{service.id}} </td>
                </ng-container>

                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef> Descripción </th>
                    <td mat-cell *matCellDef="let service"> {{service.description}} </td>
                </ng-container>

                <ng-container matColumnDef="price">
                    <th mat-header-cell *matHeaderCellDef> Precio </th>
                    <td mat-cell *matCellDef="let service"> {{service.price | currency}} </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Acciones </th>
                    <td mat-cell *matCellDef="let service">
                        <button mat-icon-button color="primary" (click)="editService(service)" matTooltip="Editar servicio">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="deleteService(service)" matTooltip="Eliminar servicio">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <div *ngIf="services.length === 0" style="padding: 24px; text-align: center; color: var(--text-secondary);">
                No hay servicios registrados en el catálogo.
            </div>
        </div>
    </mat-card>
</div>
