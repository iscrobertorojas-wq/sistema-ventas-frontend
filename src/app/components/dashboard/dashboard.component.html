<mat-card class="header-card-global">
    <mat-card-header>
        <mat-card-title>
            <mat-icon>dashboard</mat-icon>
            Resumen General
        </mat-card-title>
    </mat-card-header>
</mat-card>

<div class="dashboard-container">

    <!-- Statistics Cards -->
    <div class="stats-grid" cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="drop($event, 'stats')">
        <mat-card *ngFor="let card of statCards; let i = index" 
            class="stat-card animate-in"
            [ngClass]="[card.class === 'income' ? 'highlight-card' : '', card.gradient, 'delay-' + (i % 4 + 1), 'hover-lift']"
            [style]="card.border"
            cdkDrag>
            
            <mat-card-content>
                <div class="stat-icon" [ngClass]="card.class">
                    <mat-icon>{{card.icon}}</mat-icon>
                </div>
                <div class="stat-info">
                    <h3>{{card.title}}</h3>
                    <p class="stat-value" [class.negative-value]="(card.id === 'net' || card.id === 'profit') && getStatValue(card.id) < 0">
                        {{getStatValue(card.id) | currency}}
                    </p>
                    <p class="stat-subtitle">{{getStatSubtitle(card)}}</p>
                </div>
            </mat-card-content>

            <!-- Drag Preview Placeholder -->
            <div class="cdk-drag-placeholder" *cdkDragPlaceholder></div>
        </mat-card>
    </div>

    <!-- Charts Grid -->
    <div class="charts-grid" cdkDropList (cdkDropListDropped)="drop($event, 'charts')">
        <mat-card *ngFor="let chart of chartCards"
            class="chart-card"
            [ngClass]="[chart.isLarge ? 'large-chart' : '', 'animate-in', chart.delay]"
            cdkDrag>
            
            <mat-card-header>
                <mat-card-title>
                    <mat-icon *ngIf="chart.icon" style="vertical-align: middle; margin-right: 8px;">{{chart.icon}}</mat-icon>
                    {{chart.title}}
                </mat-card-title>
            </mat-card-header>
            
            <mat-card-content>
                <!-- Sales History Chart -->
                <div *ngIf="chart.id === 'sales_history'" class="chart-container main-chart">
                    <canvas *ngIf="chartsReady" baseChart [data]="salesByMonthData" [options]="salesByMonthOptions"
                        [type]="salesByMonthType">
                    </canvas>
                </div>

                <!-- Top Clients Chart -->
                <div *ngIf="chart.id === 'clients'" class="chart-container">
                    <canvas *ngIf="chartsReady" baseChart [data]="barChartData" [options]="barChartOptions" [type]="barChartType">
                    </canvas>
                </div>

                <!-- Payment Status Chart -->
                <div *ngIf="chart.id === 'payments'">
                    <div class="chart-container doughnut-chart">
                        <canvas *ngIf="chartsReady" baseChart [data]="doughnutChartData" [options]="doughnutChartOptions"
                            [type]="doughnutChartType">
                        </canvas>
                    </div>
                    <div class="numerical-summary">
                        <div class="summary-item">
                            <span class="label">Total Pagado:</span>
                            <span class="value paid">{{stats.monthlyIncome?.total | currency}}</span>
                        </div>
                        <div class="summary-item">
                            <span class="label">Por Cobrar:</span>
                            <span class="value pending">{{stats.pending?.total | currency}}</span>
                        </div>
                    </div>
                </div>

                <!-- Profit History Chart -->
                <div *ngIf="chart.id === 'profit_history'" class="chart-container main-chart">
                    <canvas *ngIf="chartsReady" baseChart [data]="profitChartData" [type]="profitChartType">
                    </canvas>
                </div>
            </mat-card-content>

            <!-- Drag Preview Placeholder -->
            <div class="cdk-drag-placeholder" *cdkDragPlaceholder></div>
        </mat-card>
    </div>
</div>
